<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENDUOX7 - Endurance Lap Timer</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- SETUP SCREEN -->
    <div id="setup-screen" class="screen active">
        <div class="glass-panel setup-panel" style="max-width: 600px;">
            <h1>ENDUOX7</h1>
            <p class="subtitle">Race Configuration & Registration</p>
            
            <div class="config-row">
                <div class="form-group">
                    <label for="max-time">Hour Duration (Secs)</label>
                    <input type="number" id="max-time" value="3600" min="60" max="7200">
                </div>
                <button id="btn-save-config" class="btn-outline" style="margin-top: 22px;">Save Config</button>
            </div>

            <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">

                <div class="registration-form">
                <div class="form-group">
                    <label>Bib #</label>
                    <input type="number" id="reg-bib" placeholder="e.g. 1" min="1">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="reg-category" class="styled-select">
                        <option value="duo">Duo (14 Laps/Hr)</option>
                        <option value="solo_m">Solo Male (14 Laps/Hr)</option>
                        <option value="solo_f">Solo Female (12 Laps/Hr)</option>
                    </select>
                </div>
                <button id="btn-add-team" class="btn-primary" style="margin-top: 22px;">+ Add Bib</button>
            </div>

            <div class="registered-teams-list">
                <h3>Registered Bibs (<span id="reg-count">0</span>)</h3>
                <div id="reg-teams-container"></div>
            </div>

            <button id="btn-start-race" class="btn-accent" style="margin-top: 20px; width: 100%; padding: 15px; font-size: 1.2rem;">Start Race Dashboard</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard-screen" class="screen">
        
        <header class="top-nav glass-panel">
            <div class="brand">
                <h1>ENDUOX7</h1>
                <div class="race-state-badge" id="race-state-badge">Waiting</div>
            </div>
            
            <div class="timer-section">
                <div class="current-hour" id="display-hour">Hour 1</div>
                <div class="global-time" id="global-timer">00:00:00</div>
            </div>
            
            <div class="header-actions">
                <button id="btn-start-hour" class="btn-accent">Start Hour 1</button>
                <button id="btn-export" class="btn-outline">↓ Export Excel</button>
                <button id="btn-reset" class="btn-danger">Reset</button>
            </div>
        </header>

        <div class="main-content">
            <!-- LEADERBOARD & EVENT LOG -->
            <aside class="sidebar">
                <div class="glass-panel leaderboard-panel">
                    <h2>🏆 Leaderboard</h2>
                    <div class="leaderboard-grid">
                        <div class="lb-box">
                            <h3>Duo</h3>
                            <div id="leaderboard-duo" class="list-container"></div>
                        </div>
                        <div class="lb-box">
                            <h3>Solo M</h3>
                            <div id="leaderboard-solom" class="list-container"></div>
                        </div>
                        <div class="lb-box">
                            <h3>Solo F</h3>
                            <div id="leaderboard-solof" class="list-container"></div>
                        </div>
                    </div>
                </div>

                <div class="glass-panel log-panel">
                    <h2>📝 Event Log</h2>
                    <div id="event-log" class="list-container">
                        <!-- populated via JS -->
                    </div>
                </div>
            </aside>

            <!-- TEAM GRID -->
            <main class="grid-container" style="display: flex; flex-direction: column;">
                <div id="teams-grid" class="teams-grid" style="flex: 1;">
                    <!-- populated via JS -->
                </div>
                
                <!-- FAST ENTRY BAR -->
                <div class="fast-entry-bar glass-panel" id="fast-entry-container">
                    <label for="fast-entry-input">⚡ Fast Entry</label>
                    <input type="text" id="fast-entry-input" placeholder="Type bib or comma list (e.g. 12m,5,8f) and press Enter" autocomplete="off">
                    <div class="fast-entry-hint">Duo: type 'm' or 'f' after bib. Solo: just type bib. Use commas for multiple bibs.</div>
                </div>
            </main>
        </div>
    </div>

    <!-- TEMPLATES -->
    <template id="tpl-team-card">
        <div class="team-card glass-panel" data-bib="">
                <div class="card-header">
                    <h3>Bib <span class="bib-num"></span> <span class="cat-badge"></span></h3>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <div class="status-badge">Active</div>
                        <div class="winner-badge hidden">🏆 Winner</div>
                    </div>
            </div>
            
            <div class="card-stats">
                <div class="stat-box">
                    <span class="label">Hour Laps</span>
                    <span class="val lap-count">0/14</span>
                </div>
                <div class="stat-box">
                    <span class="label">Total Laps</span>
                    <span class="val total-laps">0</span>
                </div>
            </div>

            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>

            <div class="card-actions">
                <div class="lap-buttons">
                    <button class="btn-lap btn-male" data-runner="M">+ Lap M</button>
                    <button class="btn-lap btn-female" data-runner="F">+ Lap F</button>
                </div>
                
                <div class="dnf-actions">
                    <button class="btn-dnf dnf-m" data-runner="M" title="DNF Male">M ❌</button>
                    <button class="btn-dnf dnf-f" data-runner="F" title="DNF Female">F ❌</button>
                    <button class="btn-dnf dnf-all" data-runner="BOTH" title="DNF Entire Bib">Bib DNF</button>
                </div>
                <div style="margin-top:8px; display:flex; gap:8px;">
                    <button class="btn-outline btn-delete-lap">Delete Last Lap</button>
                </div>
            </div>
        </div>
    </template>

    <div id="toast-container"></div>

    <script src="/static/app.js"></script>
</body>
</html>
